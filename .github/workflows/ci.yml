name: QABS Platform CI & Quality Check

on:
  push:
    branches: [ main, master, fix/qabs-authorized-remediation-20261113, "staging/**", "feature/**" ]
  pull_request:
    branches: [ main, master, "staging/**" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      run: npm install --no-package-lock --ignore-scripts --legacy-peer-deps

    - name: Run TypeScript & Lint Checks
      run: npm run lint

    - name: Test credit transactions (local SQLite model)
      run: npm run test:credits

    - name: Test isolated backend (SQLite and workerd D1/R2 emulators)
      run: npm run test:backend

    - name: Build Application Bundle
      run: npm run build

    - name: Test public preview isolation and asset hashes
      run: node --test tests/preview-worker.test.mjs

    - name: Upload preview build artifact
      uses: actions/upload-artifact@v4
      with:
        name: qabs-preview-dist
        path: dist/
        if-no-files-found: error
        retention-days: 2


    - name: Check Cloudflare preview deployment credentials
      id: cloudflare-creds
      if: github.event_name == 'push' && github.ref == 'refs/heads/staging/qabs-phase2-security-20261113'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "Cloudflare deployment credentials are not configured; preview deployment skipped."
        fi

    - name: Deploy isolated QABS public preview
      if: github.event_name == 'push' && github.ref == 'refs/heads/staging/qabs-phase2-security-20261113' && steps.cloudflare-creds.outputs.available == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        QABS_COMMIT_SHA: ${{ github.sha }}
      run: |
        node scripts/build-preview-worker.mjs dist preview-output
        npx --yes wrangler@4 deploy --config wrangler.toml

    - name: Security & Secret Scan
      run: |
        echo "Running limited pattern scan..."
        if grep -rn "sk_live_" src/ || grep -rn "AKIA[0-9A-Z]" src/; then
          echo "ERROR: Discovered live secret in codebase!"
          exit 1
        fi
        echo "Limited pattern scan passed; this is not a comprehensive secret audit."
