name: QABS Platform CI & Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run TypeScript & Lint Checks
      run: npm run lint

    - name: Build Application Bundle
      run: npm run build

    - name: Security & Secret Scan
      run: |
        echo "Running zero-leak secrets audit..."
        if grep -rn "sk_live_" src/ || grep -rn "AKIA[0-9A-Z]" src/; then
          echo "ERROR: Discovered live secret in codebase!"
          exit 1
        fi
        echo "Security check passed: 100% clean."
